name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meetingeconomy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meetingeconomy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meetingeconomy?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret
      OPENAI_API_KEY: <UNSPECIFIED>
      SENDGRID_API_KEY: <UNSPECIFIED>
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run db:generate
      - run: npm run build
      - run: npm test
